name: Platforms

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Platform (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Windows, os: windows-latest, node: '24', python: '3.12'}
          - {name: macOS, os: macos-latest, node: '24', python: '3.12'}
          - {name: Minimum versions, os: ubuntu-latest, node: '22.13.0', python: '3.11'}
    env:
      MCP_PYTHON: python
      PYTHONUTF8: '0'
      LLM_PROVIDER: ollama
      OLLAMA_HOST: http://127.0.0.1:1
      VLLM_BASE_URL: http://127.0.0.1:1/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: python -m pip install -r backend/finance/requirements.txt
      - run: python -m pip install -e '.[mcp]'
      - run: npm test
      - run: npm run build
      - run: python -m unittest discover -s trading_agent/tests -v
      - run: python -m trading_agent demo --start 2026-10-14 --output artifacts/trading/ci-demo
